<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ISSF pistol target">
  <!--
    Generic concentric-ring ISSF pistol target (S-01 welcome illustration).
    Original artwork — 10 at centre, rings 1..10 outward, black inner zone
    (7..10), small X ring at centre. Cream background. No real shooter data.
  -->
  <rect x="0" y="0" width="200" height="200" fill="#f4efe4" />
  <!-- Outer rings 1..6 (cream/black alternating on real targets; simplified
       to solid rings with thin separators for clarity at small sizes). -->
  <circle cx="100" cy="100" r="95" fill="#f4efe4" stroke="#2a2a2a" stroke-width="1.5" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="#2a2a2a" stroke-width="1" />
  <circle cx="100" cy="100" r="65" fill="none" stroke="#2a2a2a" stroke-width="1" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#2a2a2a" stroke-width="1" />
  <!-- Inner black zone (rings 7..10). -->
  <circle cx="100" cy="100" r="40" fill="#111" />
  <circle cx="100" cy="100" r="32" fill="none" stroke="#444" stroke-width="0.8" />
  <circle cx="100" cy="100" r="24" fill="none" stroke="#444" stroke-width="0.8" />
  <circle cx="100" cy="100" r="16" fill="none" stroke="#444" stroke-width="0.8" />
  <!-- X ring at centre. -->
  <circle cx="100" cy="100" r="8" fill="none" stroke="#888" stroke-width="0.8" />
  <circle cx="100" cy="100" r="2.5" fill="#888" />
  <!-- Ring numbers (3 and 7 o'clock positions, the ISSF convention). -->
  <text x="100" y="46" text-anchor="middle" font-size="9" fill="#2a2a2a" font-family="sans-serif">7</text>
  <text x="100" y="160" text-anchor="middle" font-size="9" fill="#2a2a2a" font-family="sans-serif">7</text>
  <text x="45" y="103" text-anchor="middle" font-size="7" fill="#2a2a2a" font-family="sans-serif">5</text>
  <text x="155" y="103" text-anchor="middle" font-size="7" fill="#2a2a2a" font-family="sans-serif">5</text>
</svg>
