<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ISSF pistol target">
  <!--
    ISSF pistol target (S-01 welcome illustration).
    10 concentric scoring rings of equal width: the outer 6 (1..6) sit on
    the cream background, the inner 4 (7..10) are filled black, with an X
    dot at the centre. Original artwork — no real shooter data.
  -->
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#f4efe4" />

  <!-- Outer 6 rings (scoring 1..6) — zones share the background colour;
       thin dark separators make each ring visible. -->
  <circle cx="100" cy="100" r="95"   fill="none" stroke="#2a2a2a" stroke-width="1.2" />
  <circle cx="100" cy="100" r="85.5" fill="none" stroke="#2a2a2a" stroke-width="0.8" />
  <circle cx="100" cy="100" r="76"   fill="none" stroke="#2a2a2a" stroke-width="0.8" />
  <circle cx="100" cy="100" r="66.5" fill="none" stroke="#2a2a2a" stroke-width="0.8" />
  <circle cx="100" cy="100" r="57"   fill="none" stroke="#2a2a2a" stroke-width="0.8" />
  <circle cx="100" cy="100" r="47.5" fill="none" stroke="#2a2a2a" stroke-width="0.8" />

  <!-- Inner 4 black rings (scoring 7..10). -->
  <circle cx="100" cy="100" r="38"   fill="#111" />
  <circle cx="100" cy="100" r="28.5" fill="none" stroke="#5a5a5a" stroke-width="0.8" />
  <circle cx="100" cy="100" r="19"   fill="none" stroke="#5a5a5a" stroke-width="0.8" />
  <circle cx="100" cy="100" r="9.5"  fill="none" stroke="#5a5a5a" stroke-width="0.8" />
  <!-- X dot at centre. -->
  <circle cx="100" cy="100" r="2" fill="#bdbdbd" />

  <!-- Ring number '7' in the outermost black ring (between r=28.5 and r=38),
       at the N / S / E / W cardinal positions (ISSF convention). -->
  <text x="100" y="67"  text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#f4efe4" font-family="sans-serif">7</text>
  <text x="100" y="133" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#f4efe4" font-family="sans-serif">7</text>
  <text x="67"  y="100" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#f4efe4" font-family="sans-serif">7</text>
  <text x="133" y="100" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#f4efe4" font-family="sans-serif">7</text>

  <!-- Ring number '8' (between r=19 and r=28.5), N / S / E / W. -->
  <text x="100" y="76.25"  text-anchor="middle" dominant-baseline="middle" font-size="6" fill="#f4efe4" font-family="sans-serif">8</text>
  <text x="100" y="123.75" text-anchor="middle" dominant-baseline="middle" font-size="6" fill="#f4efe4" font-family="sans-serif">8</text>
  <text x="76.25"  y="100" text-anchor="middle" dominant-baseline="middle" font-size="6" fill="#f4efe4" font-family="sans-serif">8</text>
  <text x="123.75" y="100" text-anchor="middle" dominant-baseline="middle" font-size="6" fill="#f4efe4" font-family="sans-serif">8</text>

  <!-- Ring number '9' (between r=9.5 and r=19), N / S / E / W. -->
  <text x="100" y="85.75"  text-anchor="middle" dominant-baseline="middle" font-size="5" fill="#f4efe4" font-family="sans-serif">9</text>
  <text x="100" y="114.25" text-anchor="middle" dominant-baseline="middle" font-size="5" fill="#f4efe4" font-family="sans-serif">9</text>
  <text x="85.75"  y="100" text-anchor="middle" dominant-baseline="middle" font-size="5" fill="#f4efe4" font-family="sans-serif">9</text>
  <text x="114.25" y="100" text-anchor="middle" dominant-baseline="middle" font-size="5" fill="#f4efe4" font-family="sans-serif">9</text>
</svg>
