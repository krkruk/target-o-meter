[project]
name = "module1"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
# All runtime deps live here (not in a dependency-group) so ANY uv sync —
# including Railpack's default `uv sync --no-dev` (which installs
# [project.dependencies] only) — picks them up. Previously django-ninja,
# django-q2, authlib lived in a `default` group and django-vite in `dev`;
# Railpack's default sync skipped groups → collectstatic failed importing
# INSTALLED_APPS. Runtime = [project.dependencies]; groups are for dev/test only.
dependencies = [
    "django>=6.0.5",
    "authlib>=1.6.6",
    "boto3>=1.35",
    "django-ninja>=1.4.1",
    "django-q2>=1.8.0",
    "django-storages>=1.14.4",
    "django-vite>=3.1.0",
    "gunicorn>=26.0.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "whitenoise>=6.12.0",
]

# PEP 735 dependency groups (AGENTS.md §3). Managed via `uv`; do NOT use
# requirements.txt. These groups hold dev/test-only tools — runtime deps live
# in [project.dependencies] above. `uv sync` installs [project.dependencies]
# by default; add `--group <name>` or `--all-groups` for the tooling below.
[dependency-groups]
dev = [
    "ruff>=0.13.0",
    "import-linter>=2.5",
]
test = [
    "pytest>=9.0.0",
    "pytest-django>=4.11.0",
    "pytest-bdd>=8.1.0",
]
system-test = [
    "httpx>=0.28.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.target_o_meter.settings"
pythonpath = ["."]
# 6.1: DEV suite runs by default (Auth0 bypassed); UAT is opt-in via -m uat +
# RUN_UAT=1. --strict-markers makes a typo'd marker a hard error.
addopts = ["--strict-markers", "--strict-config", "-m", "not uat"]
markers = [
    "dev: fast, Auth0-bypassed tests (default).",
    "uat: slow acceptance tests hitting REAL Auth0; skipped unless RUN_UAT=1.",
]

[tool.ruff]
# `cv/` is the frozen research sandbox (commit 76f6fc4) — reference-only,
# explicitly out-of-scope per plan §"What We're NOT Doing". Production code
# lives under `src/`. Exclude `cv/` from lint so the gate reflects maintained code.
exclude = ["cv/", ".venv/", "node_modules/"]
